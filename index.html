<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kur'an-ı Kerim | Ayetin Vakti</title>
    
    <!-- Sayfa yüklenirken beyaz ekran patlamasını ve tema gecikmesini önleyen kritik script -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --arabic-text-color: #f1f5f9;
            --transliteration-color: #38bdf8;
            --translation-color: #cbd5e1;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-color: #059669;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --arabic-text-color: #0f172a;
            --transliteration-color: #0284c7;
            --translation-color: #334155;
            --btn-bg: #f1f5f9;
            --btn-hover: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .navbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            position: relative;
        }

        /* Ana ekrandakine benzer yazısız yuvarlak geri dönme butonu */
        .home-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .home-btn:hover {
            background-color: var(--btn-hover);
        }

        .app-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-color);
            text-align: center;
            flex: 1;
        }

        /* Ana ekrandakine benzer yazısız yuvarlak tema butonu */
        .theme-icon-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-icon-btn:hover {
            background-color: var(--btn-hover);
        }

        .select-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .surah-select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }

        .bismillah {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            text-align: center;
            color: var(--accent-color);
            margin: 10px 0 20px 0;
            direction: rtl;
        }

        .reader-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 20px;
            min-height: 400px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .surah-info-header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
            margin-bottom: 20px;
        }

        .surah-name-tr {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .surah-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .verse-box {
            padding: 18px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .verse-box:last-child {
            border-bottom: none;
        }

        .arabic-text {
            direction: rtl;
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            line-height: 2.3;
            text-align: right;
            color: var(--arabic-text-color);
            width: 100%;
        }

        .transliteration-text {
            direction: ltr;
            font-size: 1.05rem;
            line-height: 1.6;
            text-align: left;
            color: var(--transliteration-color);
            font-weight: 500;
        }

        .translation-text {
            direction: ltr;
            font-size: 1rem;
            line-height: 1.6;
            text-align: left;
            color: var(--translation-color);
        }

        .verse-number-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-family: -apple-system, sans-serif;
            font-weight: 600;
            flex-shrink: 0;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="navbar">
        <a href="../" class="home-btn" title="Ana Sayfa">←</a>
        <div class="app-title">Kur'an-ı Kerim Meal & Okunuş</div>
        <button class="theme-icon-btn" onclick="toggleTheme()" id="theme-btn" title="Tema Değiştir">☀️</button>
    </header>

    <div class="select-card">
        <select id="surahSelect" class="surah-select" onchange="loadSurah(this.value)">
            <option value="">Sure Seçiniz...</option>
        </select>
    </div>

    <div class="reader-card">
        <div class="surah-info-header" id="surahHeader" style="display: none;">
            <div class="surah-name-tr" id="surahTitle">Fatiha Suresi</div>
            <div class="surah-meta" id="surahMeta">7 Ayet • Mekke</div>
        </div>

        <div id="bismillahHeader" class="bismillah" style="display: none;">
            بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ
        </div>

        <div id="quranContent" class="loading-spinner">
            Sure yükleniyor...
        </div>
    </div>
</div>

<script>
    let surahList = [];

    function initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        applyTheme(savedTheme);
    }

    function toggleTheme() {
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        applyTheme(isLight ? 'dark' : 'light');
    }

    function applyTheme(theme) {
        const btn = document.getElementById('theme-btn');
        if (!btn) return;
        
        if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            btn.innerHTML = '🌙'; 
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.removeAttribute('data-theme');
            btn.innerHTML = '☀️'; 
            localStorage.setItem('theme', 'dark');
        }
    }

    async function init() {
        initTheme();

        try {
            const res = await fetch('https://api.alquran.cloud/v1/surah');
            const data = await res.json();
            surahList = data.data;

            const selectEl = document.getElementById('surahSelect');
            selectEl.innerHTML = '';
            
            surahList.forEach(surah => {
                const option = document.createElement('option');
                option.value = surah.number;
                option.textContent = `${surah.number}. ${surah.englishName} (${surah.name}) - ${surah.englishNameTranslation}`;
                selectEl.appendChild(option);
            });

            loadSurah(1);
        } catch (err) {
            document.getElementById('quranContent').innerHTML = 'Sure listesi yüklenirken hata oluştu. Lütfen internet bağlantınızı kontrol edin.';
        }
    }

    async function loadSurah(surahNumber) {
        if (!surahNumber) return;

        const contentEl = document.getElementById('quranContent');
        const headerEl = document.getElementById('surahHeader');
        const bismillahEl = document.getElementById('bismillahHeader');

        contentEl.className = 'loading-spinner';
        contentEl.innerHTML = 'Ayetler, okunuşlar ve mealler yükleniyor...';

        try {
            const surahInfo = surahList.find(s => s.number == surahNumber);
            
            if (surahInfo) {
                headerEl.style.display = 'block';
                document.getElementById('surahTitle').innerText = `${surahInfo.number}. ${surahInfo.englishName} (${surahInfo.name})`;
                document.getElementById('surahMeta').innerText = `${surahInfo.numberOfAyahs} Ayet • ${surahInfo.revelationType === 'Meccan' ? 'Mekke' : 'Medine'}`;
            }

            if (parseInt(surahNumber) === 9 || parseInt(surahNumber) === 1) {
                bismillahEl.style.display = 'none';
            } else {
                bismillahEl.style.display = 'block';
            }

            const [resArabic, resTrans, resTransl] = await Promise.all([
                fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/quran-uthmani`),
                fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/tr.transliteration`),
                fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/tr.yazir`)
            ]);

            const dataArabic = await resArabic.json();
            const dataTrans = await resTrans.json();
            const dataTransl = await resTransl.json();

            const ayahsArabic = dataArabic.data.ayahs;
            const ayahsTrans = dataTrans.data.ayahs;
            const ayahsTransl = dataTransl.data.ayahs;

            let htmlContent = '';
            
            for (let i = 0; i < ayahsArabic.length; i++) {
                let arabicText = ayahsArabic[i].text;
                let transText = ayahsTrans[i].text;
                let translText = ayahsTransl[i].text;
                let ayahNum = ayahsArabic[i].numberInSurah;

                if (surahNumber != 1 && surahNumber != 9 && ayahNum === 1) {
                    arabicText = arabicText.replace('بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ', '').trim();
                }

                htmlContent += `
                    <div class="verse-box">
                        <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
                            <div class="arabic-text">${arabicText}</div>
                            <span class="verse-number-badge">${ayahNum}</span>
                        </div>
                        <div class="transliteration-text"><strong>Okunuş:</strong> ${transText}</div>
                        <div class="translation-text"><strong>Meal:</strong> ${translText}</div>
                    </div>
                `;
            }

            contentEl.className = ''; 
            contentEl.innerHTML = htmlContent;

        } catch (err) {
            contentEl.className = 'loading-spinner';
            contentEl.innerHTML = 'İçerik yüklenirken hata oluştu.';
        }
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
