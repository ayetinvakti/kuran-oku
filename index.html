<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1120">

    <script>
        // Tema, özel renk paleti ve dil (sayfa yüklenmeden önce çalışır, titremeyi önler)
        (function () {
            const d = document.documentElement;
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isLight = savedTheme === 'light' || (!savedTheme && !systemPrefersDark);
            if (isLight) d.classList.add('light-mode');
            const a = localStorage.getItem('custom_accent');
            const t = localStorage.getItem('custom_text');
            const b = localStorage.getItem('custom_bg');
            if (a) d.style.setProperty('--accent-color', a);
            if (t) d.style.setProperty('--text-color', t);
            if (b) {
                d.style.setProperty('--bg-color', b);
                d.style.setProperty('--card-bg', b);
            }
            // Özel arka plan var, yazı rengi seçilmemişse okunabilir renkleri zeminin açıklığına göre seç
            if (b && !t) {
                const m = /^#([0-9a-f]{6})$/i.exec(b.trim());
                if (m) {
                    const n = parseInt(m[1], 16);
                    const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
                    const L = 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
                    const bgIsLight = L > 0.18;
                    d.style.setProperty('--text-color', bgIsLight ? '#0f172a' : '#f8fafc');
                    d.style.setProperty('--text-muted', bgIsLight ? '#475569' : '#cbd5e1');
                    d.style.setProperty('--border-color', bgIsLight ? 'rgba(15,23,42,0.18)' : 'rgba(248,250,252,0.22)');
                    // Arapça / okunuş / meal renkleri de zemine göre okunabilir olsun (yazı rengi seçilmemişse)
                    d.style.setProperty('--arabic-text-color', bgIsLight ? '#0f172a' : '#f8fafc');
                    d.style.setProperty('--translation-color', bgIsLight ? '#334155' : '#e2e8f0');
                    d.style.setProperty('--transliteration-color', bgIsLight ? '#0369a1' : '#7dd3fc');
                }
            }
            // Safari üst/alt çubuğu sayfa zemin rengine uysun
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', b || (isLight ? '#f8fafc' : '#0b1120'));

            // Dil ve yön
            const lang = localStorage.getItem('user_lang') || 'tr';
            d.setAttribute('lang', lang);
            d.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        })();
    </script>
    <title data-i18n="page_title">Kur'an-ı Kerim | Ayetin Vakti</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --arabic-text-color: #f1f5f9;
            --transliteration-color: #38bdf8;
            --translation-color: #cbd5e1;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
            color-scheme: dark;
        }

        html.light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-color: #059669;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --arabic-text-color: #0f172a;
            --transliteration-color: #0284c7;
            --translation-color: #334155;
            --btn-bg: #f1f5f9;
            --btn-hover: #e2e8f0;
            color-scheme: light;
        }

        /* Tuşlara ard arda basınca sayfa yakınlaşmasın */
        html, body, button, a, select, input, label, [onclick] { touch-action: manipulation; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .navbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            position: relative;
        }

        .home-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        @media (hover: hover) {
            .home-btn:hover {
                background-color: var(--btn-hover);
            }
        }

        .app-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-color);
            text-align: center;
            flex: 1;
        }

        .theme-icon-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (hover: hover) {
            .theme-icon-btn:hover {
                background-color: var(--btn-hover);
            }
        }

        .select-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Hatim & İlerleme Kartı Stilleri */
        .tracker-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tracker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .tracker-title {
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: var(--bg-color);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.4s ease;
        }

        .tracker-details {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .daily-goal-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 2px;
            font-size: 0.9rem;
            flex-wrap: wrap;
            gap: 8px;
        }

        .goal-buttons {
            display: flex;
            gap: 5px;
        }

        .goal-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        @media (hover: hover) {
            .goal-btn:hover {
                background-color: var(--btn-hover);
                border-color: var(--accent-color);
            }
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        /* Arama sonuç listesi */
        .search-results {
            display: none;
            flex-direction: column;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--bg-color);
        }
        .search-results.open { display: flex; }

        .search-result-item {
            padding: 11px 14px;
            font-size: 0.92rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .search-result-item:last-child { border-bottom: none; }
        @media (hover: hover) {
            .search-result-item:hover { background-color: var(--btn-hover); }
        }
        .search-result-item .sr-sub { font-size: 0.78rem; color: var(--text-muted); }
        .search-result-item .sr-ar { font-family: 'Amiri', serif; font-size: 1.1rem; color: var(--accent-color); }
        .search-empty { padding: 12px 14px; font-size: 0.88rem; color: var(--text-muted); }

        .surah-select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }

        .bismillah {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            text-align: center;
            color: var(--accent-color);
            margin: 10px 0 20px 0;
            direction: rtl;
        }

        .reader-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 20px;
            min-height: 400px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .surah-info-header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
            margin-bottom: 20px;
        }

        .surah-name-tr {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .surah-name-ar {
            font-family: 'Amiri', serif;
            font-size: 1.5rem;
            color: var(--arabic-text-color);
            margin-top: 2px;
        }

        .surah-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .full-surah-btn {
            display: none;
            margin: 0 auto 16px auto;
            background-color: var(--btn-bg);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .verse-box {
            padding: 18px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .verse-box:last-child {
            border-bottom: none;
        }

        .verse-box.highlight {
            background-color: color-mix(in srgb, var(--accent-color) 10%, transparent);
            border-radius: 12px;
            padding: 15px;
            border: 1px dashed var(--accent-color);
        }

        .arabic-text {
            direction: rtl;
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            line-height: 2.3;
            text-align: right;
            color: var(--arabic-text-color);
            width: 100%;
        }

        .transliteration-text {
            direction: ltr;
            font-size: 1.05rem;
            line-height: 1.6;
            text-align: left;
            color: var(--transliteration-color);
            font-weight: 500;
        }

        [dir="rtl"] .transliteration-text,
        [dir="rtl"] .translation-text {
            direction: ltr;
            text-align: right;
        }

        .translation-text {
            direction: ltr;
            font-size: 1rem;
            line-height: 1.6;
            text-align: left;
            color: var(--translation-color);
        }

        /* Arapça dilinde (tefsir) metin sağdan sola */
        [dir="rtl"] .translation-text.is-ar,
        .translation-text.is-ar {
            direction: rtl;
            text-align: right;
        }

        .verse-number-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-family: -apple-system, sans-serif;
            font-weight: 600;
            flex-shrink: 0;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="navbar">
        <a href="../" class="home-btn" title="Ana Sayfa">←</a>
        <div class="app-title" data-i18n="app_title">Kur'an-ı Kerim Meal & Okunuş</div>
        <button class="theme-icon-btn" onclick="toggleTheme()" id="theme-btn" title="Tema Değiştir">🌙</button>
    </header>

    <!-- HATİM VE İLERLEME TAKİP PANELİ -->
    <div class="tracker-card">
        <div class="tracker-header">
            <div class="tracker-title"><span data-i18n="hatim_title">📖 Hatim & İlerleme Takibi</span></div>
            <span id="hatimPercentage" style="font-weight: 700; color: var(--accent-color);">%0</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="hatimProgressBar"></div>
        </div>
        <div class="tracker-details">
            <span id="lastReadInfo">Kaldığın Yer: Fatiha Suresi</span>
            <span id="totalPageInfo">Toplam: 0 / 604 Sayfa</span>
        </div>
        <div class="daily-goal-row">
            <span id="dailyGoalText">Bugün: 0 sayfa okundu</span>
            <div class="goal-buttons">
                <button class="goal-btn" onclick="addPages(-5)" data-i18n-title="back_5">-5</button>
                <button class="goal-btn" onclick="addPages(-1)" data-i18n-title="back_1">-1</button>
                <button class="goal-btn" onclick="addPages(1)">+1</button>
                <button class="goal-btn" onclick="addPages(5)">+5</button>
                <button class="goal-btn" onclick="resetHatim()" data-i18n-title="reset_title">🔄</button>
            </div>
        </div>
    </div>

    <div class="select-card">
        <input type="text" id="searchInput" class="search-input" autocomplete="off" placeholder="🔍 Sure veya Ayet ara (Örn: İnşirah, Ayetel Kürsi...)" oninput="filterSurahs()" onkeydown="searchKeydown(event)" data-i18n-placeholder="search_placeholder">
        <div id="searchResults" class="search-results"></div>
        
        <select id="surahSelect" class="surah-select" onchange="loadSurah(this.value)">
            <option value="" data-i18n="select_default">Sure Seçiniz...</option>
        </select>
    </div>

    <div class="reader-card">
        <div class="surah-info-header" id="surahHeader" style="display: none;">
            <div class="surah-name-tr" id="surahTitle">Fatiha Suresi</div>
            <div class="surah-name-ar" id="surahTitleAr"></div>
            <div class="surah-meta" id="surahMeta">7 Ayet • Mekke</div>
        </div>

        <div id="bismillahHeader" class="bismillah" style="display: none;">
            بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ
        </div>

        <button id="fullSurahBtn" class="full-surah-btn" onclick="showFullSurah()" data-i18n="show_full">Tüm sureyi oku</button>

        <div id="quranContent" class="loading-spinner" data-i18n="loading_surah">
            Sure yükleniyor...
        </div>
    </div>
</div>

<script>
    // ===================== DİL SÖZLÜĞÜ =====================
    const translations = {
        tr: {
            page_title: "Kur'an-ı Kerim | Ayetin Vakti",
            app_title: "Kur'an-ı Kerim Meal & Okunuş",

        },
        en: {

            app_title: "Quran Translation & Transliteration",
            search_placeholder: "🔍 Search Surah or Ayah (e.g. Inshirah, Ayatul Kursi, 2:255)",
            select_default: "Select Surah...",
            loading_surah: "Loading Surah...",
            loading_all: "Loading verses, transliterations and translations...",
            err_content: "Error loading content. Please check your internet connection.",
            no_results: "No results found. Try the surah name, meaning or number.",
            show_full: "Read the full surah",
            transliteration_label: "Transliteration:",
            translation_label: "Translation:",
            meccan: "Meccan",
            medinan: "Medinan",
            ayah_text: "Ayahs",
            surah_word: "Surah",
            last_read: "Last Read:",
            total_pages: "Total:",
            daily_read: "Today:",
            hatim_title: "📖 Khatm & Progress Tracker",
            page_unit: "Pages",
            confirm_reset: "Do you want to reset your progress?",
            back_5: "Undo 5 Pages",
            back_1: "Undo 1 Page",
            reset_title: "Reset Progress"
        },
        ar: {
            page_title: "القرآن الكريم | آية الوقت",

            search_placeholder: "🔍 ابحث عن سورة أو آية (مثال: الشرح، آية الكرسي، 2:255)",
            select_default: "اختر السورة...",

            loading_all: "جاري تحميل الآيات والتفسير...",
            err_content: "حدث خطأ أثناء تحميل المحتوى. يرجى التحقق من اتصالك بالإنترنت.",
            no_results: "لا توجد نتائج. جرّب اسم السورة أو معناها أو رقمها.",
            show_full: "اقرأ السورة كاملة",
            transliteration_label: "القراءة:",
            translation_label: "التفسير:",
            meccan: "مكية",
            medinan: "مدنية",
            ayah_text: "آيات",
            surah_word: "سورة",
            last_read: "آخر قراءة:",
            total_pages: "المجموع:",
            daily_read: "اليوم:",
            hatim_title: "📖 تتبع ختم القرآن",
            page_unit: "صفحة",
            confirm_reset: "هل تريد إعادة تعيين تقدم الختمة؟",
            back_5: "تراجع 5 صفحات",
            back_1: "تراجع صفحة واحدة",
            reset_title: "إعادة تعيين"
        }
    };

    const activeLang = (translations[localStorage.getItem('user_lang')] ? localStorage.getItem('user_lang') : 'tr');
    const t = translations[activeLang];

    // Dile göre içerik (okunuş / meal / tefsir) kaynakları
    const EDITIONS = {
        tr: { translit: 'tr.transliteration', transl: 'tr.yazir' },
        en: { translit: 'en.transliteration', transl: 'en.sahih' },
        ar: { translit: null,                 transl: 'ar.muyassar' }
    };
    const ed = EDITIONS[activeLang];

    // ===================== SURE İSİMLERİ (Türkçe: "Ad|Anlamı") =====================
    const SURAHS_TR = ("Fâtiha|Açılış;Bakara|İnek;Âl-i İmrân|İmran Ailesi;Nisâ|Kadınlar;Mâide|Sofra;En'âm|Hayvanlar;A'râf|Yüksek Yerler;Enfâl|Ganimetler;Tevbe|Tövbe;Yûnus|Hz. Yunus;" +
        "Hûd|Hz. Hud;Yûsuf|Hz. Yusuf;Ra'd|Gök Gürültüsü;İbrâhîm|Hz. İbrahim;Hicr|Hicr;Nahl|Arı;İsrâ|Gece Yürüyüşü;Kehf|Mağara;Meryem|Hz. Meryem;Tâhâ|Tâhâ;" +
        "Enbiyâ|Peygamberler;Hac|Hac;Mü'minûn|Müminler;Nûr|Nur;Furkân|Ayırt Edici;Şuarâ|Şairler;Neml|Karınca;Kasas|Kıssalar;Ankebût|Örümcek;Rûm|Bizanslılar;" +
        "Lokmân|Hz. Lokman;Secde|Secde;Ahzâb|Topluluklar;Sebe'|Sebe;Fâtır|Yaratan;Yâsîn|Yâsîn;Sâffât|Saf Tutanlar;Sâd|Sâd;Zümer|Kalabalıklar;Mü'min (Gâfir)|Bağışlayan;" +
        "Fussilet|Ayrıntılı Açıklanmış;Şûrâ|Danışma;Zuhruf|Altın Süs;Duhân|Duman;Câsiye|Diz Üstü Çökenler;Ahkâf|Kum Tepeleri;Muhammed|Hz. Muhammed;Fetih|Fetih;Hucurât|Odalar;Kâf|Kâf;" +
        "Zâriyât|Savuranlar;Tûr|Tûr Dağı;Necm|Yıldız;Kamer|Ay;Rahmân|Rahmân;Vâkıa|Kıyamet Olayı;Hadîd|Demir;Mücâdele|Tartışma;Haşr|Toplanma;Mümtehine|İmtihan Edilen Kadın;" +
        "Saff|Saf;Cuma|Cuma;Münâfikûn|Münafıklar;Tegâbün|Aldanma;Talâk|Boşanma;Tahrîm|Yasaklama;Mülk|Hükümranlık;Kalem|Kalem;Hâkka|Gerçek;Meâric|Yükseliş Basamakları;" +
        "Nûh|Hz. Nuh;Cin|Cinler;Müzzemmil|Örtünen;Müddessir|Bürünen;Kıyâme|Kıyamet Günü;İnsan|İnsan;Mürselât|Gönderilenler;Nebe'|Büyük Haber;Nâziât|Söküp Çıkaranlar;Abese|Surat Astı;" +
        "Tekvîr|Dürülme;İnfitâr|Yarılma;Mutaffifîn|Ölçüde Hile Yapanlar;İnşikâk|Yırtılma;Bürûc|Burçlar;Târık|Gece Gelen;A'lâ|En Yüce;Gâşiye|Kuşatan;Fecr|Şafak;Beled|Şehir;" +
        "Şems|Güneş;Leyl|Gece;Duhâ|Kuşluk;İnşirâh|Ferahlık;Tîn|İncir;Alak|Kan Pıhtısı;Kadir|Kadir Gecesi;Beyyine|Apaçık Delil;Zilzâl|Deprem;Âdiyât|Koşan Atlar;" +
        "Kâria|Çarpıcı;Tekâsür|Çoklukla Övünme;Asr|Zaman;Hümeze|Dedikoducu;Fîl|Fil;Kureyş|Kureyş;Mâûn|Küçük Yardımlar;Kevser|Bolluk;Kâfirûn|Kâfirler;Nasr|Yardım;" +
        "Tebbet (Mesed)|Ebu Leheb;İhlâs|Samimiyet;Felak|Sabah Aydınlığı;Nâs|İnsanlar").split(';').map(s => s.split('|'));

    // Aramayı kolaylaştıran ek yazılışlar (boşluksuz/alternatif yazımlar)
    const EXTRA_KEYS = {
        2: "baqarah baqara", 3: "ali imran al imran aliimran", 4: "nisa", 6: "enam anam", 7: "araf", 9: "berae tawbah", 10: "yunus",
        17: "israil isra", 18: "kahf", 26: "suara shuara", 28: "qasas", 36: "yasin yaseen", 40: "mumin gafir ghafir", 41: "hamim secde ha mim",
        42: "sura shura", 56: "vakia waqia", 58: "mujadila", 59: "hashr", 60: "mumtahina", 67: "tebareke tabarak mulk", 75: "qiyama",
        78: "amme naba", 94: "serh sharh alamnesrah", 96: "iqra alaq", 97: "qadr", 105: "feel", 107: "maun maoun", 108: "kawthar",
        109: "kafirun", 111: "mesed leheb lahab masad", 112: "ihlas ikhlas", 113: "felak falaq", 114: "nas"
    };

    // Ayet kısayolları (isim + "ayet no" yerine doğrudan bilinen ayetler)
    const AYAH_ALIASES = [
        { keys: ["ayetelkursi", "kursi", "ayatalkursi", "ayatulkursi", "آية الكرسي"], surah: 2, ayah: 255,
          names: { tr: "Ayetel Kürsi (Bakara 2:255)", en: "Ayat al-Kursi (2:255)", ar: "آية الكرسي (2:255)" } },
        { keys: ["amenerrasulu", "amanarrasul", "bakarasonayet", "آمن الرسول"], surah: 2, startAyah: 285,
          names: { tr: "Âmenerrasûlü (Bakara 285-286)", en: "Amana ar-Rasul (Al-Baqarah 285-286)", ar: "آمن الرسول (البقرة 285-286)" } }
    ];

    // ===================== DURUM =====================
    let surahMap = {};        // API'den gelen sure bilgileri (englishName, name, vb.)
    let searchIndex = [];     // Arama anahtarları
    let currentResults = [];
    let currentSurahNumber = null;
    let loadToken = 0;

    // Türkçe karakter, şapka, noktalama ve Arapça harekeleri temizleyen normalleştirme
    function norm(str) {
        return String(str || '')
            .toLocaleLowerCase('tr')
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
            .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
            .replace(/ı/g, 'i')
            .replace(/[^a-z0-9\u0600-\u06ff]/g, '');
    }

    function buildIndex() {
        searchIndex = [];
        for (let n = 1; n <= 114; n++) {
            const tr = SURAHS_TR[n - 1];
            const s = surahMap[n] || {};
            const keys = [tr[0], tr[1], s.englishName, s.englishNameTranslation, s.name, String(n)];
            if (EXTRA_KEYS[n]) EXTRA_KEYS[n].split(' ').forEach(k => keys.push(k));
            searchIndex.push({
                n: n,
                keys: keys.map(norm).filter(Boolean),
                // "mü'min (gâfir)" gibi parantezli adların parantez dışını da ayrı anahtar yap
                extra: tr[0].replace(/\(.*?\)/g, '').trim()
            });
            const base = norm(searchIndex[n - 1].extra);
            if (base && !searchIndex[n - 1].keys.includes(base)) searchIndex[n - 1].keys.push(base);
        }
    }

    function shortName(n) {
        const s = surahMap[n] || {};
        const tr = SURAHS_TR[n - 1];
        if (activeLang === 'ar') return s.name || (t.surah_word + ' ' + tr[0]);
        if (activeLang === 'en') return `${t.surah_word} ${s.englishName || tr[0]}`;
        return `${tr[0]} ${t.surah_word}`;
    }

    // Açılır listede ve sonuçlarda görünen isim (dile göre)
    function surahLabel(n) {
        const s = surahMap[n] || {};
        const tr = SURAHS_TR[n - 1];
        if (activeLang === 'ar') return `${n}. ${s.name || tr[0]}`;
        if (activeLang === 'en') return `${n}. ${s.englishName || tr[0]}${s.englishNameTranslation ? ' (' + s.englishNameTranslation + ')' : ''}`;
        return `${n}. ${tr[0]} (${tr[1]})`;
    }

    // ===================== TEMA =====================
    function updateThemeButton() {
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = document.documentElement.classList.contains('light-mode') ? '☀️' : '🌙';
    }

    // Safari üst/alt çubuğu sayfa zemin rengine uysun
    function updateThemeColor() {
        const meta = document.querySelector('meta[name="theme-color"]');
        if (!meta) return;
        const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
        if (bg) meta.setAttribute('content', bg);
    }

    function initTheme() {
        updateThemeButton();
        updateThemeColor();
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.toggle('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        updateThemeButton();
        updateThemeColor();
    }

    // ===================== HATİM & İLERLEME =====================
    function todayKey() {
        const d = new Date();
        return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    }

    // DÜZELTME: "Bugün okunan sayfa" artık her yeni günde sıfırlanıyor
    function ensureDailyReset() {
        if (localStorage.getItem('hatim_daily_date') !== todayKey()) {
            localStorage.setItem('hatim_daily_date', todayKey());
            localStorage.setItem('hatim_daily_pages', '0');
        }
    }

    function updateHatimUI() {
        ensureDailyReset();
        const totalPages = parseInt(localStorage.getItem('hatim_total_pages')) || 0;
        const dailyPages = parseInt(localStorage.getItem('hatim_daily_pages')) || 0;
        const lastNum = parseInt(localStorage.getItem('last_surah_number')) || 1;

        const maxPages = 604;
        const percentage = Math.min(100, Math.max(0, (totalPages / maxPages) * 100)).toFixed(1);

        document.getElementById('hatimPercentage').innerText = `%${percentage}`;
        document.getElementById('hatimProgressBar').style.width = `${percentage}%`;
        // "Kaldığın yer" artık seçili dile göre sure adıyla gösteriliyor
        document.getElementById('lastReadInfo').innerText = `${t.last_read} ${shortName(lastNum)}`;
        document.getElementById('totalPageInfo').innerText = `${t.total_pages} ${totalPages} / ${maxPages} ${t.page_unit}`;
        document.getElementById('dailyGoalText').innerText = `${t.daily_read} ${dailyPages} ${t.page_unit}`;
    }

    function addPages(amount) {
        ensureDailyReset();
        let totalPages = parseInt(localStorage.getItem('hatim_total_pages')) || 0;
        let dailyPages = parseInt(localStorage.getItem('hatim_daily_pages')) || 0;

        totalPages = Math.min(604, Math.max(0, totalPages + amount));
        dailyPages = Math.max(0, dailyPages + amount);

        localStorage.setItem('hatim_total_pages', totalPages);
        localStorage.setItem('hatim_daily_pages', dailyPages);
        updateHatimUI();
    }

    function resetHatim() {
        if (confirm(t.confirm_reset)) {
            localStorage.setItem('hatim_total_pages', '0');
            localStorage.setItem('hatim_daily_pages', '0');
            updateHatimUI();
        }
    }

    // ===================== BAŞLATMA =====================
    function renderSurahOptions() {
        const selectEl = document.getElementById('surahSelect');
        const current = selectEl.value;
        selectEl.innerHTML = `<option value="">${t.select_default}</option>`;
        for (let n = 1; n <= 114; n++) {
            const option = document.createElement('option');
            option.value = n;
            option.textContent = surahLabel(n);
            selectEl.appendChild(option);
        }
        if (current) selectEl.value = current;
    }

    async function init() {
        initTheme();

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key] && el.tagName !== 'TITLE') el.textContent = t[key];
        });
        document.title = t.page_title;
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (t[key]) el.placeholder = t[key];
        });
        document.querySelectorAll('[data-i18n-title]').forEach(el => {
            const key = el.getAttribute('data-i18n-title');
            if (t[key]) el.title = t[key];
        });

        // DÜZELTME: Sure listesi internet olmadan da (Türkçe adlarla) hemen çizilir
        buildIndex();
        renderSurahOptions();
        updateHatimUI();

        const lastSurahNum = parseInt(localStorage.getItem('last_surah_number')) || 1;
        document.getElementById('surahSelect').value = lastSurahNum;
        loadSurah(lastSurahNum);

        // İngilizce/Arapça adlar ve arama için API'den sure listesi çekilir
        try {
            const res = await fetch('https://api.alquran.cloud/v1/surah');
            if (!res.ok) throw new Error('API');
            const data = await res.json();
            data.data.forEach(s => { surahMap[s.number] = s; });
            buildIndex();
            renderSurahOptions();
            updateHatimUI();
        } catch (err) {
            console.log('Sure listesi API\'den alınamadı, yerel adlar kullanılıyor.', err);
        }
    }

    // ===================== ARAMA =====================
    function findSurahByName(key) {
        let best = null, bestScore = 0;
        searchIndex.forEach(item => {
            item.keys.forEach(k => {
                let sc = 0;
                if (k === key) sc = 100;
                else if (k.startsWith(key)) sc = 60;
                if (sc > bestScore) { bestScore = sc; best = item.n; }
            });
        });
        return best;
    }

    function ayahCount(n) {
        return surahMap[n] ? surahMap[n].numberOfAyahs : 286;
    }

    function runSearch(raw) {
        const results = [];
        const q = norm(raw);
        if (!q) return results;

        // 1) "2:255" / "bakara 255" / "inşirah 3" biçimleri
        const m = raw.trim().match(/^(.*?)[\s:.,\-]+(\d{1,3})$/);
        if (m && m[1].trim()) {
            const nameKey = norm(m[1]);
            const ayahNo = parseInt(m[2]);
            const sn = /^\d+$/.test(nameKey) ? parseInt(nameKey) : findSurahByName(nameKey);
            if (sn >= 1 && sn <= 114 && ayahNo >= 1 && ayahNo <= ayahCount(sn)) {
                results.push({ surah: sn, ayah: ayahNo, label: `${shortName(sn)} ${sn}:${ayahNo}` });
            }
        }

        // 2) Bilinen ayet kısayolları
        AYAH_ALIASES.forEach(a => {
            const hit = a.keys.some(k => {
                const nk = norm(k);
                return q === nk || (q.length >= 3 && nk.includes(q));
            });
            if (hit) results.push({ surah: a.surah, ayah: a.ayah || null, startAyah: a.startAyah || null, label: a.names[activeLang] || a.names.tr });
        });

        // 3) Sure adı / anlamı / numarası
        const scored = [];
        searchIndex.forEach(item => {
            let best = 0;
            item.keys.forEach(k => {
                if (/^\d+$/.test(k)) { if (k === q) best = Math.max(best, 100); return; }
                if (k === q) best = Math.max(best, 100);
                else if (k.startsWith(q)) best = Math.max(best, 70);
                else if (q.length >= 2 && k.includes(q)) best = Math.max(best, 40);
            });
            if (best > 0) scored.push({ n: item.n, score: best });
        });
        scored.sort((a, b) => b.score - a.score || a.n - b.n);
        scored.slice(0, 8).forEach(s => results.push({ surah: s.n, label: surahLabel(s.n) }));

        return results.slice(0, 10);
    }

    function filterSurahs() {
        const raw = document.getElementById('searchInput').value;
        const box = document.getElementById('searchResults');

        if (!raw.trim()) {
            closeResults();
            return;
        }

        currentResults = runSearch(raw);
        box.innerHTML = '';

        if (currentResults.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'search-empty';
            empty.textContent = t.no_results;
            box.appendChild(empty);
        } else {
            currentResults.forEach((r, i) => {
                const row = document.createElement('div');
                row.className = 'search-result-item';
                const left = document.createElement('span');
                left.textContent = r.label;
                row.appendChild(left);
                const s = surahMap[r.surah];
                if (s && s.name && activeLang !== 'ar') {
                    const right = document.createElement('span');
                    right.className = 'sr-ar';
                    right.textContent = s.name;
                    row.appendChild(right);
                }
                row.onclick = () => chooseResult(i);
                box.appendChild(row);
            });
        }
        box.classList.add('open');
    }

    function closeResults() {
        const box = document.getElementById('searchResults');
        box.classList.remove('open');
        box.innerHTML = '';
        currentResults = [];
    }

    function chooseResult(i) {
        const r = currentResults[i];
        if (!r) return;
        document.getElementById('searchInput').value = '';
        closeResults();
        loadSurah(r.surah, r.ayah || null, r.startAyah || null);
    }

    function searchKeydown(e) {
        if (e.key === 'Enter' && currentResults.length > 0) {
            e.preventDefault();
            chooseResult(0);
            e.target.blur();
        }
    }

    function showFullSurah() {
        if (currentSurahNumber) loadSurah(currentSurahNumber);
    }

    // ===================== SURE YÜKLEME =====================
    async function fetchEdition(n, edition) {
        if (!edition) return null;
        try {
            const r = await fetch(`https://api.alquran.cloud/v1/surah/${n}/${edition}`);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const j = await r.json();
            return j.data;
        } catch (e) {
            return null;
        }
    }

    function setHeader(n, d) {
        const tr = SURAHS_TR[n - 1];
        const revType = d.revelationType === 'Meccan' ? t.meccan : t.medinan;
        const count = d.numberOfAyahs;
        let title, arabicLine, meta;

        if (activeLang === 'ar') {
            title = d.name; arabicLine = '';
            meta = `${count} ${t.ayah_text} • ${revType}`;
        } else if (activeLang === 'en') {
            title = `${n}. ${t.surah_word} ${d.englishName}`; arabicLine = d.name;
            meta = `${count} ${t.ayah_text} • ${revType} • ${d.englishNameTranslation}`;
        } else {
            title = `${n}. ${tr[0]} ${t.surah_word}`; arabicLine = d.name;
            meta = `${count} ${t.ayah_text} • ${revType} • ${tr[1]}`;
        }

        document.getElementById('surahHeader').style.display = 'block';
        document.getElementById('surahTitle').innerText = title;
        document.getElementById('surahTitleAr').innerText = arabicLine;
        document.getElementById('surahMeta').innerText = meta;
    }

    async function loadSurah(surahNumber, targetAyah = null, startAyah = null) {
        const n = parseInt(surahNumber);
        if (!n || n < 1 || n > 114) return;

        const myToken = ++loadToken; // Hızlı sure değişimlerinde eski yanıtın ekrana basılmasını engeller
        currentSurahNumber = n;
        localStorage.setItem('last_surah_number', n);
        document.getElementById('surahSelect').value = n;
        updateHatimUI();

        const contentEl = document.getElementById('quranContent');
        const bismillahEl = document.getElementById('bismillahHeader');
        const fullBtn = document.getElementById('fullSurahBtn');

        contentEl.className = 'loading-spinner';
        contentEl.innerHTML = t.loading_all;
        fullBtn.style.display = (targetAyah || startAyah) ? 'block' : 'none';
        bismillahEl.style.display = (n === 9 || n === 1) ? 'none' : 'block';

        try {
            const [arabicData, translitData, translData] = await Promise.all([
                fetchEdition(n, 'quran-uthmani'),
                fetchEdition(n, ed.translit),
                fetchEdition(n, ed.transl)
            ]);

            if (myToken !== loadToken) return;
            if (!arabicData) throw new Error('Arapça metin alınamadı');

            // Başlık bilgisini içerikten de tamamlıyoruz (liste API'si gelmediyse bile çalışır)
            if (!surahMap[n]) surahMap[n] = arabicData;
            setHeader(n, surahMap[n]);

            const ayahsArabic = arabicData.ayahs;
            const ayahsTranslit = translitData ? translitData.ayahs : null;
            const ayahsTransl = translData ? translData.ayahs : null;

            let htmlContent = '';

            for (let i = 0; i < ayahsArabic.length; i++) {
                let arabicText = ayahsArabic[i].text;
                const ayahNum = ayahsArabic[i].numberInSurah;

                if (targetAyah && ayahNum !== targetAyah) continue;
                if (startAyah && ayahNum < startAyah) continue;

                // Besmele zaten üstte ayrı gösteriliyor; ilk ayetin başındaki besmeleyi (4 kelime) çıkar
                if (n !== 1 && n !== 9 && ayahNum === 1 && arabicText.startsWith('بِسْمِ')) {
                    const words = arabicText.split(' ');
                    if (words.length > 4) arabicText = words.slice(4).join(' ').trim();
                }

                const isHighlight = (targetAyah && ayahNum === targetAyah) || (startAyah && ayahNum >= startAyah);
                const translitHtml = ayahsTranslit && ayahsTranslit[i]
                    ? `<div class="transliteration-text"><strong>${t.transliteration_label}</strong> ${ayahsTranslit[i].text}</div>` : '';
                const translHtml = ayahsTransl && ayahsTransl[i]
                    ? `<div class="translation-text ${activeLang === 'ar' ? 'is-ar' : ''}"><strong>${t.translation_label}</strong> ${ayahsTransl[i].text}</div>` : '';

                htmlContent += `
                    <div class="verse-box ${isHighlight ? 'highlight' : ''}">
                        <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
                            <div class="arabic-text">${arabicText}</div>
                            <span class="verse-number-badge">${ayahNum}</span>
                        </div>
                        ${translitHtml}
                        ${translHtml}
                    </div>
                `;
            }

            contentEl.className = '';
            contentEl.innerHTML = htmlContent;

            if (targetAyah || startAyah) {
                setTimeout(() => {
                    const highlighted = document.querySelector('.verse-box.highlight');
                    if (highlighted) highlighted.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300);
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

        } catch (err) {
            if (myToken !== loadToken) return;
            contentEl.className = 'loading-spinner';
            contentEl.innerHTML = t.err_content;
        }
    }

    // Arama kutusu dışına tıklanınca sonuç listesini kapat
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.select-card')) closeResults();
    });

    document.addEventListener('DOMContentLoaded', init);
</script>
