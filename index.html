<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script>
        // Tema, Özel Renk Paleti ve Dil Kontrolü (Sayfa yüklenmeden önce çalışır, titremeyi önler)
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
            document.documentElement.setAttribute('data-theme', 'light');
        }

        const savedAccent = localStorage.getItem('custom_accent');
        const savedBg = localStorage.getItem('custom_bg');
        const savedText = localStorage.getItem('custom_text');

        if (savedAccent) document.documentElement.style.setProperty('--accent-color', savedAccent);
        if (savedBg) {
            document.documentElement.style.setProperty('--bg-color', savedBg);
            document.documentElement.style.setProperty('--card-bg', savedBg);
        }
        if (savedText) document.documentElement.style.setProperty('--text-color', savedText);

        const currentLang = localStorage.getItem('user_lang') || 'tr';
        if (currentLang === 'ar') {
            document.documentElement.setAttribute('dir', 'rtl');
        } else {
            document.documentElement.setAttribute('dir', 'ltr');
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="page_title">Kur'an-ı Kerim | Ayetin Vakti</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --arabic-text-color: #f1f5f9;
            --transliteration-color: #38bdf8;
            --translation-color: #cbd5e1;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-color: #059669;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --arabic-text-color: #0f172a;
            --transliteration-color: #0284c7;
            --translation-color: #334155;
            --btn-bg: #f1f5f9;
            --btn-hover: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .navbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            position: relative;
        }

        .home-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .home-btn:hover {
            background-color: var(--btn-hover);
        }

        .app-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-color);
            text-align: center;
            flex: 1;
        }

        .theme-icon-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-icon-btn:hover {
            background-color: var(--btn-hover);
        }

        .select-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        .surah-select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }

        .bismillah {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            text-align: center;
            color: var(--accent-color);
            margin: 10px 0 20px 0;
            direction: rtl;
        }

        .reader-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 20px;
            min-height: 400px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .surah-info-header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
            margin-bottom: 20px;
        }

        .surah-name-tr {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .surah-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .verse-box {
            padding: 18px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .verse-box:last-child {
            border-bottom: none;
        }

        .verse-box.highlight {
            background-color: rgba(16, 185, 129, 0.1);
            border-radius: 12px;
            padding: 15px;
            border: 1px dashed var(--accent-color);
        }

        .arabic-text {
            direction: rtl;
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            line-height: 2.3;
            text-align: right;
            color: var(--arabic-text-color);
            width: 100%;
        }

        .transliteration-text {
            direction: ltr;
            font-size: 1.05rem;
            line-height: 1.6;
            text-align: left;
            color: var(--transliteration-color);
            font-weight: 500;
        }

        [dir="rtl"] .transliteration-text,
        [dir="rtl"] .translation-text {
            direction: ltr;
            text-align: right;
        }

        .translation-text {
            direction: ltr;
            font-size: 1rem;
            line-height: 1.6;
            text-align: left;
            color: var(--translation-color);
        }

        .verse-number-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-family: -apple-system, sans-serif;
            font-weight: 600;
            flex-shrink: 0;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="navbar">
        <a href="../" class="home-btn" title="Ana Sayfa">←</a>
        <div class="app-title" data-i18n="app_title">Kur'an-ı Kerim Meal & Okunuş</div>
        <button class="theme-icon-btn" onclick="toggleTheme()" id="theme-btn" title="Tema Değiştir">☀️</button>
    </header>

    <div class="select-card">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Sure veya Ayet ara (Örn: İnşirah, Ayetel Kürsi...)" oninput="filterSurahs()" data-i18n-placeholder="search_placeholder">
        
        <select id="surahSelect" class="surah-select" onchange="loadSurah(this.value)">
            <option value="" data-i18n="select_default">Sure Seçiniz...</option>
        </select>
    </div>

    <div class="reader-card">
        <div class="surah-info-header" id="surahHeader" style="display: none;">
            <div class="surah-name-tr" id="surahTitle">Fatiha Suresi</div>
            <div class="surah-meta" id="surahMeta">7 Ayet • Mekke</div>
        </div>

        <div id="bismillahHeader" class="bismillah" style="display: none;">
            بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ
        </div>

        <div id="quranContent" class="loading-spinner" data-i18n="loading_surah">
            Sure yükleniyor...
        </div>
    </div>
</div>

<script>
    // Dil Sözlüğü
    const translations = {
        tr: {
            page_title: "Kur'an-ı Kerim | Ayetin Vakti",
            app_title: "Kur'an-ı Kerim Meal & Okunuş",
            search_placeholder: "🔍 Sure veya Ayet ara (Örn: İnşirah, Ayetel Kürsi...)",
            select_default: "Sure Seçiniz...",
            loading_surah: "Sure yükleniyor...",
            loading_all: "Ayetler, okunuşlar ve mealler yükleniyor...",
            err_list: "Sure listesi yüklenirken hata oluştu. Lütfen internet bağlantınızı kontrol edin.",
            err_content: "İçerik yüklenirken hata oluştu.",
            transliteration_label: "Okunuş:",
            translation_label: "Meal:",
            meccan: "Mekke",
            medinan: "Medine",
            ayah_text: "Ayet"
        },
        en: {
            page_title: "Holy Quran | Ayetin Vakti",
            app_title: "Quran Translation & Transliteration",
            search_placeholder: "🔍 Search Surah or Ayah (e.g. Inshirah, Ayatul Kursi...)",
            select_default: "Select Surah...",
            loading_surah: "Loading Surah...",
            loading_all: "Loading verses, transliterations and translations...",
            err_list: "Error loading surah list. Please check your internet connection.",
            err_content: "Error loading content.",
            transliteration_label: "Transliteration:",
            translation_label: "Translation:",
            meccan: "Meccan",
            medinan: "Medinan",
            ayah_text: "Ayahs"
        },
        ar: {
            page_title: "القرآن الكريم | آية الوقت",
            app_title: "القرآن الكريم مع التفسير والترجمة",
            search_placeholder: "🔍 ابحث عن سورة أو آية...",
            select_default: "اختر السورة...",
            loading_surah: "جاري تحميل السورة...",
            loading_all: "جاري تحميل الآيات والقراءات والمعاني...",
            err_list: "حدث خطأ أثناء تحميل قائمة السور. يرجى التحقق من اتصالك بالإنترنت.",
            err_content: "حدث خطأ أثناء تحميل المحتوى.",
            transliteration_label: "القراءة:",
            translation_label: "التفسير:",
            meccan: "مكية",
            medinan: "مدنية",
            ayah_text: "آيات"
        }
    };

    const activeLang = localStorage.getItem('user_lang') || 'tr';
    const t = translations[activeLang] || translations['tr'];

    let surahList = [];

    const customKeywords = {
        "fatiha": 1, "bakara": 2, "ali imran": 3, "nisa": 4, "maide": 5, "enam": 6, "araf": 7, "enfal": 8, "tevbe": 9, "yunus": 10,
        "hud": 11, "yusuf": 12, "rad": 13, "ibrahim": 14, "hicr": 15, "nahl": 16, "isra": 17, "kehf": 18, "meryem": 19, "taha": 20,
        "enbiya": 21, "hac": 22, "muminun": 23, "nur": 24, "furkan": 25, "suara": 26, "neml": 27, "kasas": 28, "ankebut": 29, "rum": 30,
        "lokman": 31, "secde": 32, "ahzab": 33, "sebe": 34, "fatir": 35, "yasin": 36, "saffat": 37, "sad": 38, "zumer": 39, "mumin": 40,
        "fussilet": 41, "sura": 42, "zuhruf": 43, "duhan": 44, "casiye": 45, "ahkaf": 46, "muhammed": 47, "fetih": 48, "hucurat": 49, "kaf": 50,
        "zariyat": 51, "tur": 52, "necm": 53, "kamer": 54, "rahman": 55, "vakia": 56, "hadid": 57, "mucadele": 58, "hasr": 59, "muminece": 60,
        "saff": 61, "cuma": 62, "munafikun": 63, "tegabun": 64, "talak": 65, "tahrim": 66, "mulk": 67, "kalem": 68, "hakka": 69, "mearic": 70,
        "nuh": 71, "cin": 72, "muzzemmil": 73, "muddessir": 74, "kiyame": 75, "insan": 76, "murselat": 77, "nebe": 78, "naziat": 79, "abese": 80,
        "tekvir": 81, "infitar": 82, "mutaffifin": 83, "insikak": 84, "buruc": 85, "tarik": 86, "ala": 87, "gasiye": 88, "fecr": 89, "beled": 90,
        "sems": 91, "leyl": 92, "duha": 93, "insirah": 94, "tin": 95, "alak": 96, "kadir": 97, "beyyine": 98, "zilzal": 99, "adiyat": 100,
        "karia": 101, "tekasur": 102, "asr": 103, "humeze": 104, "fil": 105, "kureys": 106, "maun": 107, "kevser": 108, "kafirun": 109, "nasr": 110,
        "tebbet": 111, "ihlas": 112, "felak": 113, "nas": 114,
        
        "ayetel kursi": { surah: 2, ayah: 255 },
        "ayetelkursi": { surah: 2, ayah: 255 },
        "kursi": { surah: 2, ayah: 255 },
        "amenerrasulu": { surah: 2, startAyah: 285 },
        "amenerrasulü": { surah: 2, startAyah: 285 }
    };

    function initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        applyTheme(savedTheme);
    }

    function toggleTheme() {
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        applyTheme(isLight ? 'dark' : 'light');
    }

    function applyTheme(theme) {
        const btn = document.getElementById('theme-btn');
        if (!btn) return;
        
        if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            btn.innerHTML = '🌙'; 
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.removeAttribute('data-theme');
            btn.innerHTML = '☀️'; 
            localStorage.setItem('theme', 'dark');
        }
    }

    async function init() {
        initTheme();

        // Statik metinleri dile göre yerleştir
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) {
                if (el.tagName === 'TITLE') document.title = t[key];
                else el.textContent = t[key];
            }
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (t[key]) el.placeholder = t[key];
        });

        try {
            const res = await fetch('https://api.alquran.cloud/v1/surah');
            const data = await res.json();
            surahList = data.data;

            renderSurahOptions(surahList);
            loadSurah(1);
        } catch (err) {
            document.getElementById('quranContent').innerHTML = t.err_list;
        }
    }

    function renderSurahOptions(list) {
        const selectEl = document.getElementById('surahSelect');
        const currentSelected = selectEl.value;
        selectEl.innerHTML = `<option value="">${t.select_default}</option>`;
        
        list.forEach(surah => {
            const option = document.createElement('option');
            option.value = surah.number;
            option.textContent = `${surah.number}. ${surah.englishName} (${surah.name}) - ${surah.englishNameTranslation}`;
            selectEl.appendChild(option);
        });

        if (currentSelected) {
            selectEl.value = currentSelected;
        }
    }

    function turkishNormalize(str) {
        return str.toLowerCase()
            .replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's')
            .replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ç/g, 'c');
    }

    function filterSurahs() {
        const rawInput = document.getElementById('searchInput').value;
        const keyword = turkishNormalize(rawInput.trim());

        if (!keyword) {
            renderSurahOptions(surahList);
            return;
        }

        for (let key in customKeywords) {
            if (keyword.includes(key)) {
                const match = customKeywords[key];
                if (typeof match === 'object') {
                    document.getElementById('surahSelect').value = match.surah;
                    loadSurah(match.surah, match.ayah || null, match.startAyah || null);
                    return;
                } else {
                    document.getElementById('surahSelect').value = match;
                    loadSurah(match);
                    return;
                }
            }
        }

        const filtered = surahList.filter(surah => {
            const nameTr = turkishNormalize(surah.englishName);
            const nameAr = turkishNormalize(surah.name);
            const trans = turkishNormalize(surah.englishNameTranslation);
            const num = surah.number.toString();

            return nameTr.includes(keyword) || nameAr.includes(keyword) || trans.includes(keyword) || num === keyword;
        });

        renderSurahOptions(filtered);

        if (filtered.length > 0 && keyword.length >= 3) {
            document.getElementById('surahSelect').value = filtered[0].number;
            loadSurah(filtered[0].number);
        }
    }

    async function loadSurah(surahNumber, targetAyah = null, startAyah = null) {
        if (!surahNumber) return;

        const contentEl = document.getElementById('quranContent');
        const headerEl = document.getElementById('surahHeader');
        const bismillahEl = document.getElementById('bismillahHeader');

        contentEl.className = 'loading-spinner';
        contentEl.innerHTML = t.loading_all;

        try {
            const surahInfo = surahList.find(s => s.number == surahNumber);
            
            if (surahInfo) {
                headerEl.style.display = 'block';
                const revType = surahInfo.revelationType === 'Meccan' ? t.meccan : t.medinan;
                document.getElementById('surahTitle').innerText = `${surahInfo.number}. ${surahInfo.englishName} (${surahInfo.name})`;
                document.getElementById('surahMeta').innerText = `${surahInfo.numberOfAyahs} ${t.ayah_text} • ${revType}`;
            }

            if (parseInt(surahNumber) === 9 || parseInt(surahNumber) === 1) {
                bismillahEl.style.display = 'none';
            } else {
                bismillahEl.style.display = 'block';
            }

            const [resArabic, resTrans, resTransl] = await Promise.all([
                fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/quran-uthmani`),
                fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/tr.transliteration`),
                fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/tr.yazir`)
            ]);

            const dataArabic = await resArabic.json();
            const dataTrans = await resTrans.json();
            const dataTransl = await resTransl.json();

            const ayahsArabic = dataArabic.data.ayahs;
            const ayahsTrans = dataTrans.data.ayahs;
            const ayahsTransl = dataTransl.data.ayahs;

            let htmlContent = '';
            
            for (let i = 0; i < ayahsArabic.length; i++) {
                let arabicText = ayahsArabic[i].text;
                let transText = ayahsTrans[i].text;
                let translText = ayahsTransl[i].text;
                let ayahNum = ayahsArabic[i].numberInSurah;

                if (targetAyah && ayahNum !== targetAyah) continue;
                if (startAyah && ayahNum < startAyah) continue;

                if (surahNumber != 1 && surahNumber != 9 && ayahNum === 1) {
                    arabicText = arabicText.replace('بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ', '').trim();
                }

                const isHighlight = (targetAyah && ayahNum === targetAyah) || (startAyah && ayahNum >= startAyah);

                htmlContent += `
                    <div class="verse-box ${isHighlight ? 'highlight' : ''}">
                        <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
                            <div class="arabic-text">${arabicText}</div>
                            <span class="verse-number-badge">${ayahNum}</span>
                        </div>
                        <div class="transliteration-text"><strong>${t.transliteration_label}</strong> ${transText}</div>
                        <div class="translation-text"><strong>${t.translation_label}</strong> ${translText}</div>
                    </div>
                `;
            }

            contentEl.className = ''; 
            contentEl.innerHTML = htmlContent;

            if (targetAyah || startAyah) {
                setTimeout(() => {
                    const highlighted = document.querySelector('.verse-box.highlight');
                    if (highlighted) {
                        highlighted.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 300);
            }

        } catch (err) {
            contentEl.className = 'loading-spinner';
            contentEl.innerHTML = t.err_content;
        }
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
